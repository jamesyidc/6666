<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全币数据统计系统 - 完整视图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        select, button {
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .data-table-container {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 25px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 4500px; /* 35列超宽表格 */
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
            font-size: 13px;
        }

        th {
            background: rgba(255, 255, 255, 0.1);
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .positive { color: #38ef7d; }
        .negative { color: #ff6b6b; }
        .neutral { color: #a8b8d8; }

        .field-group {
            border-left: 3px solid;
            padding-left: 5px;
        }

        .group-basic { border-color: #667eea; }
        .group-price { border-color: #38ef7d; }
        .group-signal { border-color: #ff6b6b; }
        .group-ratio { border-color: #f093fb; }
        .group-history { border-color: #feca57; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #38ef7d;
        }

        .stat-label {
            font-size: 12px;
            color: #a8b8d8;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #a8b8d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💎 全币数据统计系统 - 完整数据视图 (35列)</h1>
            <p style="margin-top: 10px; color: #a8b8d8;">显示35个字段的超级完整币种数据表格</p>
            <p style="margin-top: 5px; color: #feca57; font-size: 12px;">
                ⚠️ 部分字段暂无数据源（显示"-"），未来将逐步补充
            </p>
        </div>

        <div class="controls">
            <label>选择日期:</label>
            <select id="dateSelect">
                <option value="">加载中...</option>
            </select>
            
            <label>选择快照:</label>
            <select id="snapshotSelect">
                <option value="">请先选择日期</option>
            </select>
            
            <button onclick="loadData()">🔄 刷新数据</button>
            <button onclick="exportToCSV()">📥 导出CSV</button>
        </div>

        <div id="statsSection" class="stats" style="display: none;"></div>

        <div class="data-table-container">
            <div id="loadingIndicator" class="loading">加载中...</div>
            <div id="tableContainer" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5002'
            : 'https://5002-iik759kgm7i3zqlxvfrfx-cc2fbc16.sandbox.novita.ai';
        
        let currentData = null;

        // 页面加载时初始化
        window.onload = async function() {
            await loadAvailableDates();
        };

        // 加载可用日期
        async function loadAvailableDates() {
            try {
                const response = await fetch(`${API_BASE}/api/history/dates`);
                const data = await response.json();
                
                if (data.success && data.dates.length > 0) {
                    const select = document.getElementById('dateSelect');
                    select.innerHTML = '';
                    
                    data.dates.forEach(date => {
                        const option = document.createElement('option');
                        option.value = date.date;
                        option.textContent = `${date.date} (${date.snapshots}个快照)`;
                        select.appendChild(option);
                    });
                    
                    // 自动选择最新日期
                    select.value = data.dates[0].date;
                    await loadSnapshots(data.dates[0].date);
                }
            } catch (error) {
                console.error('加载日期失败:', error);
                document.getElementById('loadingIndicator').textContent = '加载失败: ' + error.message;
            }
        }

        // 加载指定日期的快照列表
        async function loadSnapshots(date) {
            try {
                const response = await fetch(`${API_BASE}/api/history/snapshots?date=${date}`);
                const data = await response.json();
                
                if (data.success && data.snapshots.length > 0) {
                    const select = document.getElementById('snapshotSelect');
                    select.innerHTML = '';
                    
                    data.snapshots.forEach((snapshot, index) => {
                        const option = document.createElement('option');
                        option.value = snapshot.datetime;
                        option.textContent = `${snapshot.time} - ${snapshot.total_coins}币种 (涨${snapshot.rising_coins}/跌${snapshot.falling_coins})`;
                        select.appendChild(option);
                    });
                    
                    // 自动选择最新快照（最后一个）
                    select.value = data.snapshots[data.snapshots.length - 1].datetime;
                    await loadSnapshotDetail(select.value);
                }
            } catch (error) {
                console.error('加载快照列表失败:', error);
            }
        }

        // 监听日期选择变化
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('dateSelect').addEventListener('change', function() {
                loadSnapshots(this.value);
            });
            
            document.getElementById('snapshotSelect').addEventListener('change', function() {
                if (this.value) {
                    loadSnapshotDetail(this.value);
                }
            });
        });

        // 加载快照详细数据
        async function loadSnapshotDetail(datetime) {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('tableContainer').style.display = 'none';
            
            try {
                const response = await fetch(`${API_BASE}/api/history/snapshot/${encodeURIComponent(datetime)}`);
                const data = await response.json();
                
                if (data.success) {
                    currentData = data;
                    displayStats(data.snapshot);
                    displayFullTable(data.coins);
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('tableContainer').style.display = 'block';
                    document.getElementById('statsSection').style.display = 'grid';
                }
            } catch (error) {
                console.error('加载快照详情失败:', error);
                document.getElementById('loadingIndicator').textContent = '加载失败: ' + error.message;
            }
        }

        // 显示统计信息
        function displayStats(snapshot) {
            const stats = [
                { label: '快照时间', value: snapshot.datetime, color: '#667eea' },
                { label: '币种总数', value: snapshot.total_coins, color: '#38ef7d' },
                { label: '上涨币种', value: snapshot.rising_coins, color: '#38ef7d' },
                { label: '下跌币种', value: snapshot.falling_coins, color: '#ff6b6b' },
                { label: '平均账户比例', value: snapshot.account_ratio_avg.toFixed(2) + '%', color: '#f093fb' },
                { label: '平均24h涨跌', value: snapshot.avg_change_24h.toFixed(2) + '%', color: '#feca57' },
            ];
            
            let html = '';
            stats.forEach(stat => {
                html += `
                    <div class="stat-card" style="border-left-color: ${stat.color}">
                        <div class="stat-value">${stat.value}</div>
                        <div class="stat-label">${stat.label}</div>
                    </div>
                `;
            });
            
            document.getElementById('statsSection').innerHTML = html;
        }

        // 显示完整数据表格 - 35列完整版
        function displayFullTable(coins) {
            let html = `
                <table>
                    <thead>
                        <tr>
                            <!-- 基础信息 (5列) -->
                            <th class="field-group group-basic">序号</th>
                            <th class="field-group group-basic">排名</th>
                            <th class="field-group group-basic">币种</th>
                            <th class="field-group group-basic">等级</th>
                            <th class="field-group group-basic">更新时间</th>
                            
                            <!-- 价格数据 (7列) -->
                            <th class="field-group group-price">当前价格</th>
                            <th class="field-group group-price">24h涨跌%</th>
                            <th class="field-group group-price">短期变化%</th>
                            <th class="field-group group-price">历史最高价</th>
                            <th class="field-group group-price">最高价时间</th>
                            <th class="field-group group-price">跌幅%</th>
                            <th class="field-group group-price">24h最低</th>
                            
                            <!-- 信号指标 (6列) -->
                            <th class="field-group group-signal">急涨次数</th>
                            <th class="field-group group-signal">急跌次数</th>
                            <th class="field-group group-signal">累计急涨</th>
                            <th class="field-group group-signal">累计急跌</th>
                            <th class="field-group group-signal">做多信号</th>
                            <th class="field-group group-signal">做空信号</th>
                            
                            <!-- 账户比例 (5列) -->
                            <th class="field-group group-ratio">账户比例</th>
                            <th class="field-group group-ratio">比例1</th>
                            <th class="field-group group-ratio">比例2</th>
                            <th class="field-group group-ratio">多空比</th>
                            <th class="field-group group-ratio">持仓量</th>
                            
                            <!-- 技术指标 (6列) -->
                            <th class="field-group group-history">RSI</th>
                            <th class="field-group group-history">MACD</th>
                            <th class="field-group group-history">KDJ</th>
                            <th class="field-group group-history">布林带位置</th>
                            <th class="field-group group-history">SAR趋势</th>
                            <th class="field-group group-history">成交量变化</th>
                            
                            <!-- 市场数据 (6列) -->
                            <th>24h成交量</th>
                            <th>市值</th>
                            <th>流通量</th>
                            <th>总供应量</th>
                            <th>市值排名</th>
                            <th>备注</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            coins.forEach((coin, index) => {
                const changeClass = coin.change_24h >= 0 ? 'positive' : 'negative';
                const shortChangeClass = coin.change_short >= 0 ? 'positive' : (coin.change_short < 0 ? 'negative' : 'neutral');
                
                html += `
                    <tr>
                        <!-- 基础信息 -->
                        <td>${index + 1}</td>
                        <td>${coin.rank}</td>
                        <td><strong>${coin.symbol}</strong></td>
                        <td>${coin.priority || '-'}</td>
                        <td>${coin.update_time || '-'}</td>
                        
                        <!-- 价格数据 -->
                        <td>$${coin.price.toFixed(4)}</td>
                        <td class="${changeClass}">${coin.change_24h.toFixed(2)}%</td>
                        <td class="${shortChangeClass}">${coin.change_short ? coin.change_short.toFixed(2) + '%' : '-'}</td>
                        <td>${coin.high_price ? '$' + coin.high_price.toFixed(2) : '-'}</td>
                        <td>${coin.high_time || '-'}</td>
                        <td class="negative">${coin.decline ? coin.decline.toFixed(2) + '%' : '-'}</td>
                        <td>-</td>
                        
                        <!-- 信号指标 -->
                        <td>${coin.rush_up || '0'}</td>
                        <td>${coin.rush_down || '0'}</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        
                        <!-- 账户比例 -->
                        <td>${coin.account_ratio.toFixed(2)}%</td>
                        <td>${coin.ratio1 || '-'}</td>
                        <td>${coin.ratio2 || '-'}</td>
                        <td>-</td>
                        <td>-</td>
                        
                        <!-- 技术指标 -->
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        
                        <!-- 市场数据 -->
                        <td>${coin.volume_24h || '-'}</td>
                        <td>${coin.market_cap || '-'}</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                        <td>-</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('tableContainer').innerHTML = html;
        }

        // 刷新数据
        async function loadData() {
            const datetime = document.getElementById('snapshotSelect').value;
            if (datetime) {
                await loadSnapshotDetail(datetime);
            }
        }

        // 导出CSV - 35列完整版
        function exportToCSV() {
            if (!currentData || !currentData.coins) {
                alert('没有数据可导出');
                return;
            }

            const coins = currentData.coins;
            const headers = [
                // 基础信息
                '序号', '排名', '币种', '等级', '更新时间',
                // 价格数据
                '当前价格', '24h涨跌%', '短期变化%', '历史最高价', '最高价时间', '跌幅%', '24h最低',
                // 信号指标
                '急涨次数', '急跌次数', '累计急涨', '累计急跌', '做多信号', '做空信号',
                // 账户比例
                '账户比例', '比例1', '比例2', '多空比', '持仓量',
                // 技术指标
                'RSI', 'MACD', 'KDJ', '布林带位置', 'SAR趋势', '成交量变化',
                // 市场数据
                '24h成交量', '市值', '流通量', '总供应量', '市值排名', '备注'
            ];
            
            let csv = headers.join(',') + '\n';
            
            coins.forEach((coin, index) => {
                const row = [
                    // 基础信息
                    index + 1, coin.rank, coin.symbol, coin.priority || '', coin.update_time || '',
                    // 价格数据
                    coin.price, coin.change_24h, coin.change_short || '', coin.high_price || '', 
                    coin.high_time || '', coin.decline || '', '',
                    // 信号指标
                    coin.rush_up || 0, coin.rush_down || 0, '', '', '', '',
                    // 账户比例
                    coin.account_ratio, coin.ratio1 || '', coin.ratio2 || '', '', '',
                    // 技术指标
                    '', '', '', '', '', '',
                    // 市场数据
                    coin.volume_24h || '', coin.market_cap || '', '', '', '', ''
                ];
                csv += row.join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `coin_data_35_columns_${currentData.snapshot.datetime.replace(/[: ]/g, '_')}.csv`;
            link.click();
        }
    </script>
</body>
</html>
