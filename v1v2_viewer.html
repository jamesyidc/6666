<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1V2成交量数据统计系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        
        .home-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .home-btn:hover {
            background: white;
            color: #667eea;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
            flex-wrap: wrap;
        }
        
        .stat-item { text-align: center; }
        .stat-label { font-size: 0.9rem; color: #6c757d; margin-bottom: 5px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #667eea; }
        
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #e9ecef;
        }
        
        .search-input {
            flex: 1;
            min-width: 200px;
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .table-container {
            padding: 30px;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }
        
        thead {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        th.number { text-align: center; width: 60px; }
        th.volume { text-align: right; }
        th.percent { text-align: right; width: 120px; }
        
        tbody tr {
            border-bottom: 1px solid #f0f0f0;
            transition: all 0.3s;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
            transform: scale(1.01);
        }
        
        td {
            padding: 15px;
            font-size: 0.95rem;
        }
        
        td.number {
            text-align: center;
            font-weight: 600;
            color: #6c757d;
        }
        
        td.symbol {
            font-weight: 600;
            color: #667eea;
            font-size: 1rem;
        }
        
        td.volume {
            text-align: right;
            font-weight: 600;
            color: #28a745;
            font-family: 'Courier New', monospace;
        }
        
        td.percent {
            text-align: right;
            font-weight: 600;
        }
        
        .percent-bar {
            display: inline-block;
            height: 20px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            margin-left: 10px;
            min-width: 2px;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #6c757d;
        }
        
        .error {
            text-align: center;
            padding: 30px;
            color: #dc3545;
            background: #f8d7da;
            border-radius: 8px;
            margin: 20px;
        }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 1.8rem; }
            .stats-bar { gap: 20px; }
            .stat-value { font-size: 1.4rem; }
            .controls { flex-direction: column; }
            .search-input { width: 100%; }
            table { font-size: 0.85rem; }
            th, td { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <a href="/" class="home-btn">🏠 返回首页</a>
            <h1>📊 V1V2成交量数据统计系统</h1>
            <p>实时监控27个主流加密货币成交量数据</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">监控币种</div>
                <div class="stat-value" id="totalCoins">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">总成交量 (USDT)</div>
                <div class="stat-value" style="color: #28a745;" id="totalVolume">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">数据时间</div>
                <div class="stat-value" style="font-size: 1.2rem; color: #6c757d;" id="updateTime">-</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索币种 (如: BTC, ETH...)">
            <button class="btn btn-primary" onclick="loadData()">🔄 手动刷新</button>
            <button class="btn btn-primary" onclick="toggleAutoRefresh()" id="autoRefreshBtn">⏸️ 关闭自动刷新</button>
            <button class="btn btn-primary" onclick="exportToCSV()">📊 导出CSV</button>
        </div>

        <div class="table-container">
            <div id="loading" class="loading">正在加载数据...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="tableWrapper" style="display: none;">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th class="number">#</th>
                            <th>币种</th>
                            <th class="volume">成交量 (USDT)</th>
                            <th class="percent">占比</th>
                            <th>更新时间</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5004'
            : 'https://5004-iik759kgm7i3zqlxvfrfx-cc2fbc16.sandbox.novita.ai';

        let allData = [];
        let filteredData = [];
        let autoRefresh = true;
        let refreshTimer = null;

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            startAutoRefresh();
            
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                filteredData = allData.filter(coin => coin.symbol.toLowerCase().includes(searchTerm));
                renderTable();
            });
        });

        // 加载数据
        async function loadData() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').style.display = 'none';
                document.getElementById('tableWrapper').style.display = 'none';
                
                const response = await fetch(`${API_BASE}/api/v1v2/latest`);
                const data = await response.json();

                if (data.success) {
                    allData = data.data;
                    filteredData = [...allData];
                    
                    // 更新统计
                    document.getElementById('totalCoins').textContent = data.count;
                    document.getElementById('totalVolume').textContent = formatVolume(data.total_volume);
                    document.getElementById('updateTime').textContent = data.update_time;
                    
                    renderTable();
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('tableWrapper').style.display = 'block';
                } else {
                    showError('数据加载失败: ' + data.error);
                }
            } catch (error) {
                console.error('Error loading data:', error);
                showError('网络错误，请检查连接');
            }
        }

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px; color: #6c757d;">没有找到匹配的币种</td></tr>';
                return;
            }
            
            // 计算总量用于百分比
            const totalVolume = filteredData.reduce((sum, coin) => sum + coin.volume, 0);
            
            let html = '';
            filteredData.forEach((coin, index) => {
                const percent = (coin.volume / totalVolume * 100).toFixed(2);
                const barWidth = Math.max(percent * 3, 2); // 最小2px
                
                html += `
                    <tr>
                        <td class="number">${index + 1}</td>
                        <td class="symbol">${coin.symbol.replace('-USDT-SWAP', '')}</td>
                        <td class="volume">${formatVolume(coin.volume)}</td>
                        <td class="percent">
                            ${percent}%
                            <span class="percent-bar" style="width: ${barWidth}px;"></span>
                        </td>
                        <td>${coin.update_time}</td>
                    </tr>
                `;
            });
            
            tbody.innerHTML = html;
        }

        // 格式化成交量
        function formatVolume(volume) {
            if (volume >= 1000000) {
                return (volume / 1000000).toFixed(2) + 'M';
            } else if (volume >= 1000) {
                return (volume / 1000).toFixed(2) + 'K';
            }
            return volume.toFixed(2);
        }

        // 显示错误
        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('tableWrapper').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = message;
        }

        // 自动刷新
        function startAutoRefresh() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(() => {
                if (autoRefresh) {
                    loadData();
                }
            }, 30000); // 30秒
        }

        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('autoRefreshBtn');
            btn.textContent = autoRefresh ? '⏸️ 关闭自动刷新' : '▶️ 开启自动刷新';
        }

        // 导出CSV
        function exportToCSV() {
            const headers = ['排名', '币种', '成交量(USDT)', '占比(%)', '更新时间'];
            const totalVolume = filteredData.reduce((sum, coin) => sum + coin.volume, 0);
            
            let csv = headers.join(',') + '\n';
            
            filteredData.forEach((coin, index) => {
                const percent = (coin.volume / totalVolume * 100).toFixed(2);
                csv += [
                    index + 1,
                    coin.symbol.replace('-USDT-SWAP', ''),
                    coin.volume.toFixed(2),
                    percent,
                    coin.update_time
                ].join(',') + '\n';
            });
            
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `v1v2_volume_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }
    </script>
</body>
</html>
