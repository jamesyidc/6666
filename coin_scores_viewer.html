<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>币种多空评分数据统计系统 - 完整视图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e9ecef;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-value.long {
            color: #28a745;
        }

        .stat-value.short {
            color: #dc3545;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-input {
            padding: 12px 20px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            flex: 1;
            min-width: 200px;
        }

        .table-container {
            padding: 30px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .symbol-cell {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
        }

        .trend-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .trend-long {
            background: #d4edda;
            color: #155724;
        }

        .trend-short {
            background: #f8d7da;
            color: #721c24;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #667eea;
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #dc3545;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .stats-bar {
                flex-direction: column;
                gap: 15px;
            }

            .controls {
                flex-direction: column;
            }

            .table-container {
                padding: 15px;
            }

            th, td {
                padding: 8px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 币种多空评分数据统计系统</h1>
            <p>实时监控多空评分、SAR趋势、RSI指标等完整数据</p>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">总币种数</div>
                <div class="stat-value" id="totalCoins">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">多头币种</div>
                <div class="stat-value long" id="longCount">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">空头币种</div>
                <div class="stat-value short" id="shortCount">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">更新时间</div>
                <div class="stat-value" style="font-size: 1.2rem; color: #6c757d;" id="updateTime">-</div>
            </div>
        </div>

        <div class="controls">
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索币种 (如: BTC, ETH...)">
            <button class="btn btn-primary" onclick="loadData()">🔄 手动刷新</button>
            <button class="btn btn-primary" onclick="toggleAutoRefresh()" id="autoRefreshBtn">⏸️ 关闭自动刷新</button>
        </div>

        <div class="table-container">
            <div id="loading" class="loading">正在加载数据...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="tableWrapper" style="display: none;">
                <table id="dataTable"></table>
            </div>
        </div>
    </div>

    <script>
        // API配置
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:5003'
            : 'https://5003-iik759kgm7i3zqlxvfrfx-cc2fbc16.sandbox.novita.ai';

        let allData = [];
        let filteredData = [];
        let autoRefresh = true;
        let refreshTimer = null;

        // 加载数据
        async function loadData() {
            try {
                const response = await fetch(`${API_BASE}/api/coin-scores/latest`);
                const data = await response.json();

                if (data.success) {
                    allData = data.data;
                    filteredData = [...allData];
                    updateStats(data);
                    renderTable();
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'none';
                    document.getElementById('tableWrapper').style.display = 'block';
                } else {
                    throw new Error(data.error || '数据加载失败');
                }
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = `❌ 加载失败: ${error.message}`;
            }
        }

        // 更新统计信息
        function updateStats(data) {
            document.getElementById('totalCoins').textContent = data.count;
            document.getElementById('longCount').textContent = data.long_count;
            document.getElementById('shortCount').textContent = data.short_count;
            document.getElementById('updateTime').textContent = data.update_time;
        }

        // 渲染表格
        function renderTable() {
            const table = document.getElementById('dataTable');
            
            let html = `
                <thead>
                    <tr>
                        <th>币种</th>
                        <th>时间</th>
                        <th>5m SAR趋势</th>
                        <th>1h SAR趋势</th>
                        <th>多头评分</th>
                        <th>空头评分</th>
                        <th>RSI 5m</th>
                        <th>RSI 1h</th>
                        <th>多空比</th>
                        <th>价格</th>
                        <th>3m多头平均</th>
                        <th>1h多头平均</th>
                        <th>3m空头平均</th>
                        <th>1h空头平均</th>
                    </tr>
                </thead>
                <tbody>
            `;

            filteredData.forEach(coin => {
                const symbol = coin.symbol.replace('-USDT-SWAP', '');
                const time = coin.beijing_time ? coin.beijing_time.split(' ')[1] : '-';
                
                html += `
                    <tr>
                        <td class="symbol-cell">${symbol}</td>
                        <td>${time}</td>
                        <td>
                            <span class="trend-badge trend-${coin.sar_5m_trend === '多头' ? 'long' : 'short'}">
                                ${coin.sar_5m_trend} ${String(coin.sar_5m_duration).padStart(2, '0')}
                            </span>
                        </td>
                        <td>
                            <span class="trend-badge trend-${coin.sar_1h_trend === '多头' ? 'long' : 'short'}">
                                ${coin.sar_1h_trend} ${String(coin.sar_1h_duration).padStart(2, '0')}
                            </span>
                        </td>
                        <td style="color: #28a745; font-weight: 600;">${coin.long_score?.toFixed(2) || '-'}</td>
                        <td style="color: #dc3545; font-weight: 600;">${coin.short_score?.toFixed(2) || '-'}</td>
                        <td>${coin.rsi_5m?.toFixed(2) || '-'}</td>
                        <td>${coin.rsi_1h?.toFixed(2) || '-'}</td>
                        <td>${coin.long_short_ratio?.toFixed(4) || '-'}</td>
                        <td>${coin.price_5m?.toFixed(2) || '-'}</td>
                        <td>${coin.long_score_3m_avg?.toFixed(2) || '-'}</td>
                        <td>${coin.long_score_1h_avg?.toFixed(2) || '-'}</td>
                        <td>${coin.short_score_3m_avg?.toFixed(2) || '-'}</td>
                        <td>${coin.short_score_1h_avg?.toFixed(2) || '-'}</td>
                    </tr>
                `;
            });

            html += '</tbody>';
            table.innerHTML = html;
        }

        // 搜索过滤
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            filteredData = allData.filter(coin => 
                coin.symbol.toLowerCase().includes(searchTerm)
            );
            renderTable();
        });

        // 切换自动刷新
        function toggleAutoRefresh() {
            autoRefresh = !autoRefresh;
            const btn = document.getElementById('autoRefreshBtn');
            
            if (autoRefresh) {
                btn.textContent = '⏸️ 关闭自动刷新';
                startAutoRefresh();
            } else {
                btn.textContent = '▶️ 开启自动刷新';
                stopAutoRefresh();
            }
        }

        // 启动自动刷新
        function startAutoRefresh() {
            refreshTimer = setInterval(() => {
                if (autoRefresh) {
                    loadData();
                }
            }, 30000); // 30秒
        }

        // 停止自动刷新
        function stopAutoRefresh() {
            if (refreshTimer) {
                clearInterval(refreshTimer);
                refreshTimer = null;
            }
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            startAutoRefresh();
        });
    </script>
</body>
</html>
