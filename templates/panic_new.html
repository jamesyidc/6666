<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐慌清洗指数 - 加密货币数据分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #1e2139;
            color: #fff;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
            padding: 0;
        }
        
        /* 顶部导航栏 */
        .top-nav {
            background: #2a2d47;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            justify-content: space-between;
        }
        
        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .home-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        
        .home-btn:hover {
            background: linear-gradient(135deg, #0099ff 0%, #00d4ff 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.4);
        }
        
        .nav-title {
            font-size: 18px;
            font-weight: 500;
            color: #fff;
        }
        
        /* 当前数据统计栏 */
        .stats-bar {
            background: #2a2d47;
            padding: 15px 20px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            border-bottom: 1px solid #3a3d5c;
            font-size: 13px;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .stat-label {
            color: #8b92b8;
            font-size: 12px;
        }
        
        .stat-value {
            color: #fff;
            font-weight: 600;
            font-size: 20px;
        }
        
        .stat-value.green {
            color: #10b981;
        }
        
        .stat-value.yellow {
            color: #fbbf24;
        }
        
        .stat-value.red {
            color: #ef4444;
        }
        
        .stat-sublabel {
            color: #6b7280;
            font-size: 11px;
        }
        
        /* 图表容器 */
        .chart-container {
            background: #2a2d47;
            padding: 20px;
            margin: 0;
            border-bottom: 1px solid #3a3d5c;
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #fff;
        }
        
        #panicChart {
            width: 100%;
            height: 400px;
        }
        
        /* 时间查询工具 */
        .time-query-box {
            background: #1e2139;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .time-query-label {
            color: #8b92b8;
            font-size: 14px;
            font-weight: 500;
        }
        
        .time-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .time-input {
            background: #2a2d47;
            border: 1px solid #3a3d5c;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            min-width: 150px;
        }
        
        .time-input:focus {
            outline: none;
            border-color: #00d4ff;
        }
        
        .query-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .query-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
        }
        
        .reset-btn {
            background: #3a3d5c;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .reset-btn:hover {
            background: #4a4d6c;
        }
        
        .query-result {
            color: #00d4ff;
            font-size: 14px;
            margin-left: 10px;
        }
        
        /* 历史数据表格 */
        .history-container {
            background: #2a2d47;
            padding: 20px;
            border-bottom: 1px solid #3a3d5c;
        }
        
        .history-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .history-table thead {
            background: #1e2139;
        }
        
        .history-table th {
            padding: 10px;
            text-align: left;
            color: #8b92b8;
            font-weight: 500;
            border-bottom: 1px solid #3a3d5c;
        }
        
        .history-table td {
            padding: 10px;
            border-bottom: 1px solid #3a3d5c;
        }
        
        .history-table tbody tr:hover {
            background: #1e2139;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #8b92b8;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .stats-bar {
                gap: 15px;
            }
            
            .stat-value {
                font-size: 16px;
            }
            
            #panicChart {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航 -->
        <div class="top-nav">
            <div class="nav-left">
                <a href="/" class="home-btn">
                    <span>🏠</span>
                    <span>返回首页</span>
                </a>
                <div class="nav-title">⚡ 恐慌清洗指数</div>
            </div>
        </div>
        
        <!-- 当前数据统计栏 -->
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-label">恐慌清洗指数</div>
                <div class="stat-value" id="currentIndex">--</div>
                <div class="stat-sublabel" id="currentLevel">--</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">1小时爆仓金额</div>
                <div class="stat-value" id="hour1Amount">--</div>
                <div class="stat-sublabel">万美元</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">24小时爆仓金额</div>
                <div class="stat-value" id="hour24Amount">--</div>
                <div class="stat-sublabel">万美元</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">24小时爆仓人数</div>
                <div class="stat-value" id="currentPeople">--</div>
                <div class="stat-sublabel">万人</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">全网持仓量</div>
                <div class="stat-value" id="currentPosition">--</div>
                <div class="stat-sublabel">亿美元</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">最后更新</div>
                <div class="stat-value" id="updateTime" style="font-size: 16px;">--</div>
                <div class="stat-sublabel">每3分钟更新</div>
            </div>
        </div>
        
        <!-- 曲线图 -->
        <div class="chart-container">
            <div class="chart-title">📈 恐慌清洗指数趋势</div>
            <div id="panicChart"></div>
        </div>
        
        <!-- 历史数据表格 -->
        <div class="history-container">
            <div class="history-title">📋 恐慌指数历史记录</div>
            
            <!-- 时间查询工具 -->
            <div class="time-query-box">
                <span class="time-query-label">🔍 时间查询：</span>
                <div class="time-input-group">
                    <input type="datetime-local" id="queryDateTime" class="time-input" placeholder="选择日期时间">
                    <button onclick="queryHistoryByTime()" class="query-btn">查询</button>
                    <button onclick="resetQuery()" class="reset-btn">重置</button>
                    <span id="queryResult" class="query-result"></span>
                </div>
            </div>
            
            <div id="loadingHistory" class="loading">正在加载历史数据...</div>
            <table class="history-table" id="historyTable" style="display: none;">
                <thead>
                    <tr>
                        <th>记录时间</th>
                        <th>1h爆仓 (万$)</th>
                        <th>24h爆仓 (亿$)</th>
                        <th>恐慌指数</th>
                        <th>等级</th>
                        <th>爆仓人数 (万人)</th>
                        <th>全网持仓 (亿$)</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                </tbody>
            </table>
        </div>
        
        <!-- 30日爆仓数据日历 -->
        <div class="history-container">
            <div class="history-title">📅 30日爆仓数据日历</div>
            <div id="loading30Days" class="loading">正在加载30日爆仓数据...</div>
            <table class="history-table" id="liquidation30Table" style="display: none;">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>多单爆仓</th>
                        <th>空单爆仓</th>
                        <th>总爆仓</th>
                    </tr>
                </thead>
                <tbody id="liquidation30Body">
                </tbody>
            </table>
            <div class="stat-sublabel" id="liquidation30UpdateTime" style="margin-top: 10px; text-align: right;"></div>
        </div>
    </div>
    
    <script>
        let chart = null;
        
        // 初始化图表
        function initChart() {
            const chartDom = document.getElementById('panicChart');
            chart = echarts.init(chartDom);
            
            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#2a2d47',
                    borderColor: '#3a3d5c',
                    textStyle: {
                        color: '#fff'
                    },
                    formatter: function(params) {
                        let html = params[0].axisValue + '<br/>';
                        params.forEach(param => {
                            if (param.seriesName === '恐慌清洗指数') {
                                html += param.marker + param.seriesName + ': ' + param.value.toFixed(2) + '%<br/>';
                            } else if (param.seriesName === '全网持仓量') {
                                // 格式化为合理的亿单位显示（保留2位小数）
                                let valueInYi = param.value;
                                html += param.marker + param.seriesName + ': $' + valueInYi.toFixed(2) + '亿<br/>';
                            }
                        });
                        return html;
                    }
                },
                legend: {
                    data: ['恐慌清洗指数', '全网持仓量'],
                    top: 10,
                    textStyle: {
                        color: '#8b92b8'
                    }
                },
                grid: {
                    left: '3%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: [],
                    axisLine: {
                        lineStyle: {
                            color: '#3a3d5c'
                        }
                    },
                    axisLabel: {
                        color: '#8b92b8'
                    }
                },
                yAxis: [
                    {
                        type: 'value',
                        name: '恐慌指数 (%)',
                        position: 'left',
                        min: 9,
                        max: 13,
                        interval: 1,
                        nameTextStyle: {
                            color: '#3b7dff'
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#3a3d5c'
                            }
                        },
                        splitLine: {
                            lineStyle: {
                                color: '#3a3d5c'
                            }
                        },
                        axisLabel: {
                            color: '#3b7dff',
                            formatter: '{value}%'
                        }
                    },
                    {
                        type: 'value',
                        name: '全网持仓 (亿$)',
                        position: 'right',
                        min: 90,
                        max: 100,
                        interval: 2,
                        nameTextStyle: {
                            color: '#10b981'
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#3a3d5c'
                            }
                        },
                        axisLabel: {
                            color: '#10b981',
                            formatter: '${value}亿'
                        },
                        splitLine: {
                            show: false
                        }
                    }
                ],
                series: [
                    {
                        name: '恐慌清洗指数',
                        type: 'line',
                        yAxisIndex: 0,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        data: [],
                        lineStyle: {
                            width: 2,
                            color: '#3b7dff'
                        },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [
                                    {
                                        offset: 0,
                                        color: 'rgba(59, 125, 255, 0.3)'
                                    },
                                    {
                                        offset: 1,
                                        color: 'rgba(59, 125, 255, 0.05)'
                                    }
                                ]
                            }
                        }
                    },
                    {
                        name: '全网持仓量',
                        type: 'line',
                        yAxisIndex: 1,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 6,
                        data: [],
                        lineStyle: {
                            width: 2,
                            color: '#10b981'
                        }
                    }
                ]
            };
            
            chart.setOption(option);
        }
        
        // 加载当前数据
        async function loadCurrentData() {
            try {
                const response = await fetch('/api/panic/latest');
                const result = await response.json();
                
                if (result.success && result.data) {
                    const data = result.data;
                    
                    // 更新统计栏
                    const indexEl = document.getElementById('currentIndex');
                    indexEl.textContent = data.panic_index.toFixed(2) + '%';
                    
                    // 设置颜色
                    indexEl.className = 'stat-value ' + (data.level_color || 'green');
                    
                    document.getElementById('currentLevel').textContent = data.panic_level || '--';
                    document.getElementById('hour1Amount').textContent = '$' + data.hour_1_amount.toFixed(2);
                    document.getElementById('hour24Amount').textContent = '$' + data.hour_24_amount.toFixed(2);
                    document.getElementById('currentPeople').textContent = data.hour_24_people.toFixed(2);
                    document.getElementById('currentPosition').textContent = '$' + data.total_position.toFixed(2);
                    document.getElementById('updateTime').textContent = data.record_time.split(' ')[1];
                }
            } catch (error) {
                console.error('加载当前数据失败:', error);
            }
        }
        
        // 加载历史数据并更新图表
        async function loadHistoryData() {
            try {
                const conn = await fetch('/api/panic/history?limit=50');
                const result = await conn.json();
                
                if (result.success && result.data && result.data.length > 0) {
                    const data = result.data.reverse(); // 时间正序
                    
                    // 更新图表 - 添加两条曲线
                    const times = data.map(item => item.record_time.split(' ')[1].substring(0, 5));
                    const panicValues = data.map(item => item.panic_index.toFixed(2));
                    const positionValues = data.map(item => item.total_position.toFixed(2));
                    
                    // 动态计算恐慌指数Y轴范围：最低-1%，最高+1%
                    const panicNumbers = data.map(item => item.panic_index);
                    const panicMin = Math.min(...panicNumbers);
                    const panicMax = Math.max(...panicNumbers);
                    
                    // 恐慌指数：最低-1%，最高+1%
                    const yAxisMin = Math.floor(panicMin) - 1;
                    const yAxisMax = Math.ceil(panicMax) + 1;
                    const yAxisInterval = 0.5;  // 固定0.5%刻度间隔
                    
                    // 动态计算全网持仓Y轴范围：最低-1亿，最高+1亿
                    const positionNumbers = data.map(item => item.total_position);
                    const positionMin = Math.min(...positionNumbers);
                    const positionMax = Math.max(...positionNumbers);
                    
                    // 全网持仓：最低-1亿，最高+1亿
                    const positionYMin = Math.floor(positionMin) - 1;
                    const positionYMax = Math.ceil(positionMax) + 1;
                    const positionYInterval = 0.5;  // 固定0.5亿刻度间隔
                    
                    chart.setOption({
                        xAxis: {
                            data: times
                        },
                        yAxis: [
                            {
                                type: 'value',
                                name: '恐慌指数 (%)',
                                position: 'left',
                                min: yAxisMin,
                                max: yAxisMax,
                                interval: yAxisInterval,
                                nameTextStyle: {
                                    color: '#3b7dff'
                                },
                                axisLine: {
                                    lineStyle: {
                                        color: '#3a3d5c'
                                    }
                                },
                                splitLine: {
                                    lineStyle: {
                                        color: '#3a3d5c'
                                    }
                                },
                                axisLabel: {
                                    color: '#3b7dff',
                                    formatter: '{value}%'
                                }
                            },
                            {
                                type: 'value',
                                name: '全网持仓 (亿$)',
                                position: 'right',
                                min: positionYMin,
                                max: positionYMax,
                                interval: positionYInterval,
                                nameTextStyle: {
                                    color: '#10b981'
                                },
                                axisLine: {
                                    lineStyle: {
                                        color: '#3a3d5c'
                                    }
                                },
                                axisLabel: {
                                    color: '#10b981',
                                    formatter: '${value}亿'
                                },
                                splitLine: {
                                    show: false
                                }
                            }
                        ],
                        series: [
                            {
                                name: '恐慌清洗指数',
                                data: panicValues
                            },
                            {
                                name: '全网持仓量',
                                data: positionValues
                            }
                        ]
                    });
                    
                    // 更新表格
                    const tbody = document.getElementById('historyTableBody');
                    tbody.innerHTML = '';
                    
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        
                        let levelColor = 'green';
                        if (item.panic_index >= 5) levelColor = 'red';
                        else if (item.panic_index >= 2) levelColor = 'yellow';
                        
                        let levelText = '低恐慌';
                        if (item.panic_index >= 5) levelText = '高度恐慌';
                        else if (item.panic_index >= 2) levelText = '中度恐慌';
                        
                        tr.innerHTML = `
                            <td>${item.record_time}</td>
                            <td>$${item.hour_1_amount.toFixed(2)}万</td>
                            <td>$${item.hour_24_amount.toFixed(2)}万</td>
                            <td><span class="${levelColor}" style="font-weight: 600;">${item.panic_index.toFixed(2)}%</span></td>
                            <td><span class="${levelColor}">${levelText}</span></td>
                            <td>${item.hour_24_people.toFixed(2)}万人</td>
                            <td>${item.total_position.toFixed(2)}亿美元</td>
                        `;
                        
                        tbody.appendChild(tr);
                    });
                    
                    document.getElementById('loadingHistory').style.display = 'none';
                    document.getElementById('historyTable').style.display = 'table';
                }
            } catch (error) {
                console.error('加载历史数据失败:', error);
                document.getElementById('loadingHistory').textContent = '❌ 加载失败: ' + error.message;
            }
        }
        
        // 时间查询功能
        let allHistoryData = [];  // 存储所有历史数据
        
        async function queryHistoryByTime() {
            const dateTimeInput = document.getElementById('queryDateTime');
            const resultSpan = document.getElementById('queryResult');
            
            if (!dateTimeInput.value) {
                resultSpan.textContent = '⚠️ 请选择查询时间';
                resultSpan.style.color = '#fbbf24';
                return;
            }
            
            // 转换选择的时间为查询格式
            const selectedDate = new Date(dateTimeInput.value);
            const queryTime = selectedDate.toISOString().slice(0, 16).replace('T', ' ');
            
            try {
                resultSpan.textContent = '🔍 查询中...';
                resultSpan.style.color = '#00d4ff';
                
                // 查询指定时间附近的数据（前后10条）
                const response = await fetch(`/api/panic/history?time=${encodeURIComponent(queryTime)}&limit=20`);
                const result = await response.json();
                
                if (result.success && result.data && result.data.length > 0) {
                    // 找到最接近的记录
                    let closestRecord = result.data[0];
                    let minDiff = Math.abs(new Date(closestRecord.record_time) - selectedDate);
                    
                    result.data.forEach(item => {
                        const diff = Math.abs(new Date(item.record_time) - selectedDate);
                        if (diff < minDiff) {
                            minDiff = diff;
                            closestRecord = item;
                        }
                    });
                    
                    // 更新表格，高亮匹配的记录
                    const tbody = document.getElementById('historyTableBody');
                    tbody.innerHTML = '';
                    
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        const isMatch = item.record_time === closestRecord.record_time;
                        
                        let levelColor = 'green';
                        if (item.panic_index >= 5) levelColor = 'red';
                        else if (item.panic_index >= 2) levelColor = 'yellow';
                        
                        let levelText = '低恐慌';
                        if (item.panic_index >= 5) levelText = '高度恐慌';
                        else if (item.panic_index >= 2) levelText = '中度恐慌';
                        
                        tr.innerHTML = `
                            <td${isMatch ? ' style="background: rgba(0, 212, 255, 0.2); font-weight: 600;"' : ''}>${item.record_time}</td>
                            <td${isMatch ? ' style="background: rgba(0, 212, 255, 0.2);"' : ''}>$${item.hour_1_amount.toFixed(2)}万</td>
                            <td${isMatch ? ' style="background: rgba(0, 212, 255, 0.2);"' : ''}>$${item.hour_24_amount.toFixed(2)}万</td>
                            <td${isMatch ? ' style="background: rgba(0, 212, 255, 0.2);"' : ''}><span class="${levelColor}" style="font-weight: 600;">${item.panic_index.toFixed(2)}%</span></td>
                            <td${isMatch ? ' style="background: rgba(0, 212, 255, 0.2);"' : ''}><span class="${levelColor}">${levelText}</span></td>
                            <td${isMatch ? ' style="background: rgba(0, 212, 255, 0.2);"' : ''}>${item.hour_24_people.toFixed(2)}万人</td>
                            <td${isMatch ? ' style="background: rgba(0, 212, 255, 0.2);"' : ''}>${item.total_position.toFixed(2)}亿美元</td>
                        `;
                        
                        tbody.appendChild(tr);
                    });
                    
                    // 显示查询结果
                    const timeDiff = Math.abs(minDiff / 1000 / 60); // 转换为分钟
                    if (timeDiff < 5) {
                        resultSpan.textContent = `✅ 找到精确匹配: ${closestRecord.record_time}`;
                        resultSpan.style.color = '#10b981';
                    } else {
                        resultSpan.textContent = `✅ 找到最近记录: ${closestRecord.record_time} (相差${timeDiff.toFixed(0)}分钟)`;
                        resultSpan.style.color = '#fbbf24';
                    }
                    
                    // 滚动到匹配的记录
                    document.getElementById('historyTable').scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    resultSpan.textContent = '❌ 未找到相关数据';
                    resultSpan.style.color = '#ef4444';
                }
            } catch (error) {
                console.error('查询失败:', error);
                resultSpan.textContent = '❌ 查询失败: ' + error.message;
                resultSpan.style.color = '#ef4444';
            }
        }
        
        // 重置查询
        function resetQuery() {
            document.getElementById('queryDateTime').value = '';
            document.getElementById('queryResult').textContent = '';
            loadHistoryData();  // 重新加载所有数据
        }
        
        // 加载30日爆仓数据
        async function load30DaysLiquidation() {
            try {
                const response = await fetch('/api/liquidation/30days');
                const result = await response.json();
                
                if (result.success && result.data && result.data.length > 0) {
                    const tbody = document.getElementById('liquidation30Body');
                    tbody.innerHTML = '';
                    
                    result.data.forEach(item => {
                        const tr = document.createElement('tr');
                        
                        tr.innerHTML = `
                            <td>${item.date}</td>
                            <td style="color: #10b981;">$${item.long_amount}亿</td>
                            <td style="color: #ef4444;">$${item.short_amount}亿</td>
                            <td style="font-weight: 600;">$${item.total_amount}亿</td>
                        `;
                        
                        tbody.appendChild(tr);
                    });
                    
                    // 显示更新时间
                    if (result.data[0].updated_at) {
                        document.getElementById('liquidation30UpdateTime').textContent = 
                            '最后更新: ' + result.data[0].updated_at + ' (每1小时更新)';
                    }
                    
                    document.getElementById('loading30Days').style.display = 'none';
                    document.getElementById('liquidation30Table').style.display = 'table';
                } else {
                    document.getElementById('loading30Days').textContent = '❌ 暂无30日爆仓数据';
                }
            } catch (error) {
                console.error('加载30日爆仓数据失败:', error);
                document.getElementById('loading30Days').textContent = '❌ 加载失败: ' + error.message;
            }
        }
        
        // 页面加载完成后执行
        window.onload = function() {
            initChart();
            loadCurrentData();
            loadHistoryData();
            load30DaysLiquidation();
            
            // 每30秒刷新当前数据
            setInterval(loadCurrentData, 30000);
        };
    </script>
</body>
</html>
